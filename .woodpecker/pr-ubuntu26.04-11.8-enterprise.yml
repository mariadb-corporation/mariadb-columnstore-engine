    - success
    - failure
- commands:
  - mkdir -p "$${CI_WORKSPACE}/../mdb"
  - rm -rf /mdb
  - ln -s "$${CI_WORKSPACE}/../mdb" /mdb
  - ': "$${MTR_FULL_SUITE:=false}"'
  - sh -c "apk add bash && timeout 1800 bash /mdb/verylongdirnameforverystrangecpackbehavior/storage/columnstore/columnstore/build/prepare_test_container.sh  --container-name
    mtr-ubuntu26.04$${CI_PIPELINE_NUMBER} --docker-image detravi/ubuntu:26.04 --result-path
    ubuntu26.04 --packages-url https://cspkg.s3.amazonaws.com/stable-23.10/pull_request/$${CI_PIPELINE_NUMBER}/11.8-enterprise
    --do-setup true --do-install true --do-install-builddeps true"
  - apk add bash && timeout 18000 bash /mdb/verylongdirnameforverystrangecpackbehavior/storage/columnstore/columnstore/build/run_mtr.sh  --container-name
    mtr-ubuntu26.04$${CI_PIPELINE_NUMBER} --distro ubuntu:26.04 --run-as-extern --triggering-event
    pull_request --full-mtr $${MTR_FULL_SUITE}
  depends_on:
