      from_secret: aws_access_key_id
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
    AWS_SECRET_ACCESS_KEY:
      from_secret: aws_secret_access_key
  image: amazon/aws-cli:2.22.30
  name: publish-cmapilog
  when:
