    --exclude "*$${CURRENT_VERSION}*.deb" --exclude "*$${CURRENT_VERSION}*.rpm" --only-show-errors
  - aws s3 sync ubuntu26.04/ s3://cspkg/stable-23.10/pull_request/$${CI_PIPELINE_NUMBER}/11.8-enterprise/amd64/ubuntu26.04
    --only-show-errors
  - 'echo "Data uploaded to: https://cspkg.s3.amazonaws.com/index.html?prefix=stable-23.10/pull_request/$${CI_PIPELINE_NUMBER}/11.8-enterprise/amd64/ubuntu26.04/"'
  depends_on:
  - smokelog
  - createrepo
  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: aws_access_key_id
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
    AWS_SECRET_ACCESS_KEY:
      from_secret: aws_secret_access_key
  image: amazon/aws-cli:2.22.30
  name: publish-smokelog
  when:
  - status:
    - success
    - failure
- commands:
  - mkdir -p "$${CI_WORKSPACE}/../mdb"
  - rm -rf /mdb
  - ln -s "$${CI_WORKSPACE}/../mdb" /mdb
  - sh -c "apk add bash && timeout 1800 bash /mdb/verylongdirnameforverystrangecpackbehavior/storage/columnstore/columnstore/build/prepare_test_container.sh  --container-name
    cmapi-ubuntu26.04$${CI_PIPELINE_NUMBER} --docker-image detravi/ubuntu:26.04 --result-path
    ubuntu26.04 --packages-url https://cspkg.s3.amazonaws.com/stable-23.10/pull_request/$${CI_PIPELINE_NUMBER}/11.8-enterprise
    --do-setup true --do-install true --do-install-builddeps true"
  - apk add bash && timeout 3600 bash /mdb/verylongdirnameforverystrangecpackbehavior/storage/columnstore/columnstore/build/run_cmapi_test.sh  --container-name
    cmapi-ubuntu26.04$${CI_PIPELINE_NUMBER} --pkg-format deb
  depends_on:
  - publish-cmapi-build
  environment:
    PYTHONPATH: /usr/share/columnstore/cmapi/deps
  image: docker:git
  name: cmapi-test
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
- commands:
  - mkdir -p "$${CI_WORKSPACE}/../mdb"
  - rm -rf /mdb
  - ln -s "$${CI_WORKSPACE}/../mdb" /mdb
  - sh -c "apk add bash && bash /mdb/verylongdirnameforverystrangecpackbehavior/storage/columnstore/columnstore/build/report_test_stage.sh  --container-name
    cmapi-ubuntu26.04$${CI_PIPELINE_NUMBER} --result-path ubuntu26.04 --stage cmapi"
  depends_on:
  - cmapi-test
  image: docker:28.2.2
  name: cmapilog
  volumes:
