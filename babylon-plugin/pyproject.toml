[project]
name = "babylon-columnstore"
version = "0.1.0"
description = "ColumnStore plugin for babylon — deployer, repository provider, burza runner, report presenter"
requires-python = ">=3.11,<4"
dependencies = [
    "babylon",
    "structlog (>=24.0,<26)",
    "pyyaml (>=6.0,<7)",
]

[tool.poetry.dependencies]
babylon = {path = "../../babylon", develop = true}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9"
pytest-asyncio = ">=0.24,<1"
ruff = "^0.15.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["babylon_columnstore"]
